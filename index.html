  <body class="bg-slate-950 text-slate-100 font-['Vazirmatn',sans-serif] antialiased selection:bg-amber-500/30 selection:text-amber-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        if (typeof window !== 'undefined' && (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost')) {
          setInterval(function() {
            try { fetch('/api/ping', { cache: 'no-store' }).catch(function(){}); } catch(e){}
          }, 3000);
          window.addEventListener('beforeunload', function() {
            try {
              if (navigator.sendBeacon) {
                navigator.sendBeacon('/api/shutdown');
              } else {
                fetch('/api/shutdown', { keepalive: true, method: 'POST' }).catch(function(){});
              }
            } catch(e){}
          });
        }
      })();
    </script>
