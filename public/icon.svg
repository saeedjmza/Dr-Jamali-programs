<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient for Icon rounded squircle -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b172a"/>
      <stop offset="50%" stop-color="#08101e"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>

    <!-- Tunnel Lining Concrete/Steel Arch Gradient -->
    <linearGradient id="archConcreteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8093a7"/>
      <stop offset="25%" stop-color="#a4b4c4"/>
      <stop offset="50%" stop-color="#c9d6e2"/>
      <stop offset="75%" stop-color="#9bb0c4"/>
      <stop offset="100%" stop-color="#6c8095"/>
    </linearGradient>

    <!-- Inner Tunnel Cavern Gradient (Perspective depth) -->
    <radialGradient id="cavernDepth" cx="50%" cy="63%" r="52%">
      <stop offset="0%" stop-color="#02050b"/>
      <stop offset="65%" stop-color="#07101f"/>
      <stop offset="100%" stop-color="#0b182d"/>
    </radialGradient>

    <!-- Road Surface Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#141c2c"/>
      <stop offset="100%" stop-color="#0a101b"/>
    </linearGradient>

    <!-- Glowing yellow accent gradient -->
    <linearGradient id="yellowAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Rock Facet Shading Gradients -->
    <linearGradient id="rockDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2a47"/>
      <stop offset="100%" stop-color="#0d1728"/>
    </linearGradient>
    <linearGradient id="rockMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283e65"/>
      <stop offset="100%" stop-color="#152238"/>
    </linearGradient>
    <linearGradient id="rockLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b5682"/>
      <stop offset="100%" stop-color="#223554"/>
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#fbbf24" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Background Rounded Squircle Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- 2. Surrounding Fractured Rock Mass (Faceted Mountain Strata) -->
  <g id="rock-strata">
    <!-- Top Left & Crown Rock Blocks -->
    <polygon points="40,240 70,160 140,110 180,50 256,40 180,130 110,210 40,240" fill="url(#rockDark)" />
    <polygon points="180,50 256,40 310,55 256,110 180,130" fill="url(#rockLight)" />
    <polygon points="70,160 140,110 110,65 180,50 70,160" fill="url(#rockMid)" />
    <polygon points="40,150 70,160 110,65 40,90" fill="url(#rockDark)" />

    <!-- Top Right Mountain Rock Blocks -->
    <polygon points="310,55 380,65 440,110 410,160 340,125 256,110" fill="url(#rockMid)" />
    <polygon points="380,65 440,110 475,85 410,50" fill="url(#rockLight)" />
    <polygon points="440,110 475,170 410,160" fill="url(#rockDark)" />
    <polygon points="410,160 480,240 430,280 395,210 340,125" fill="url(#rockMid)" />
    <polygon points="430,280 480,360 440,380 395,300" fill="url(#rockDark)" />
    <polygon points="440,380 480,440 400,410" fill="url(#rockLight)" />

    <!-- Left Flank Rock Blocks -->
    <polygon points="40,240 110,210 100,300 35,320" fill="url(#rockMid)" />
    <polygon points="35,320 100,300 115,380 40,400" fill="url(#rockDark)" />
    <polygon points="40,400 115,380 120,440 40,450" fill="url(#rockLight)" />

    <!-- Golden Stress Joints / Discontinuities (Rock Fractures with Amber Glow) -->
    <!-- Left Joint Lines -->
    <path d="M 36,360 L 78,310 L 68,260 L 98,225" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glowGold)" />
    <path d="M 120,70 L 175,54 L 220,78" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glowGold)" />
    <!-- Right Joint Lines -->
    <path d="M 330,68 L 380,64 L 435,95" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glowGold)" />
    <path d="M 432,235 L 452,280 L 476,355" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glowGold)" />
    <path d="M 425,370 L 448,405 L 475,435" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glowGold)" />
  </g>

  <!-- 3. Tunnel Portal Structure -->
  <!-- Outer Arch Concrete / Steel Lining -->
  <g id="tunnel-arch" filter="url(#iconShadow)">
    <!-- Heavy Concrete Portal Arch Ring: Horseshoe geometry -->
    <path d="M 112,380 L 112,236 C 112,156 176,108 256,108 C 336,108 400,156 400,236 L 400,380 L 360,380 L 360,236 C 360,178 314,142 256,142 C 198,142 152,178 152,236 L 152,380 Z"
          fill="url(#archConcreteGrad)" stroke="#56697d" stroke-width="2" />

    <!-- Vibrant Yellow Inner Rib / Pre-cast Liner Ring -->
    <path d="M 152,380 L 152,236 C 152,178 198,142 256,142 C 314,142 360,178 360,236 L 360,380 L 348,380 L 348,236 C 348,186 307,154 256,154 C 205,154 164,186 164,236 L 164,380 Z"
          fill="url(#yellowAccent)" />

    <!-- Arch Pedestal Footings / Foundations (Left and Right) -->
    <!-- Left Footing Box -->
    <polygon points="80,366 142,366 142,416 80,416" fill="#475569" stroke="#334155" stroke-width="1.5" />
    <polygon points="80,366 100,348 142,348 142,366" fill="#64748b" />
    <polygon points="100,348 142,348 142,416 100,416" fill="#94a3b8" />

    <!-- Right Footing Box -->
    <polygon points="368,366 428,366 428,416 368,416" fill="#475569" stroke="#334155" stroke-width="1.5" />
    <polygon points="368,366 388,348 428,348 428,366" fill="#64748b" />
    <polygon points="388,348 428,348 428,416 388,416" fill="#94a3b8" />
  </g>

  <!-- 4. Cavern Void Inside Tunnel & Perspective Roadway -->
  <g id="tunnel-cavern">
    <clipPath id="innerPortalClip">
      <path d="M 164,416 L 164,236 C 164,186 205,154 256,154 C 307,154 348,186 348,236 L 348,416 Z" />
    </clipPath>

    <!-- Deep Cavern Interior -->
    <rect x="150" y="140" width="212" height="280" fill="url(#cavernDepth)" clip-path="url(#innerPortalClip)" />

    <!-- Roadbed & Perspective Lanes -->
    <!-- Road Surface Triangle converging to vanishing point at (256, 326) -->
    <polygon points="65,450 447,450 256,326" fill="url(#roadGrad)" />

    <!-- Yellow Road Edge Curbs / Lines -->
    <line x1="65" y1="450" x2="236" y2="336" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" />
    <line x1="447" y1="450" x2="276" y2="336" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" />

    <!-- Distant Tunnel Light (Sunrise / Exit Portal Glow) -->
    <path d="M 238,336 C 238,326 246,316 256,316 C 266,316 274,326 274,336 Z" fill="#fbbf24" filter="url(#glowGold)" />

    <!-- Dashed Center Lane Marking (in perspective) -->
    <!-- Far dash -->
    <polygon points="254.5,340 257.5,340 258,354 254,354" fill="#fbbf24" />
    <!-- Mid-far dash -->
    <polygon points="253.5,360 258.5,360 259.5,378 252.5,378" fill="#fbbf24" />
    <!-- Mid dash -->
    <polygon points="252,388 260,388 261.5,410 250.5,410" fill="#fbbf24" />
    <!-- Near bottom dash -->
    <polygon points="246,440 266,440 268,465 244,465" fill="#fbbf24" />
  </g>

  <!-- 5. Geotechnical Rock Mass Rating Chart (Overlay on Center-Left of Tunnel) -->
  <g id="geotech-chart" filter="url(#iconShadow)">
    <!-- Coordinate Axes (X & Y) in Bright Goldenrod Yellow -->
    <!-- Vertical Y-Axis with Arrowhead -->
    <line x1="170" y1="338" x2="170" y2="198" stroke="#fde047" stroke-width="4.5" stroke-linecap="square" />
    <polygon points="170,188 163,204 177,204" fill="#fde047" />

    <!-- Horizontal X-Axis with Arrowhead -->
    <line x1="170" y1="338" x2="346" y2="338" stroke="#fde047" stroke-width="4.5" stroke-linecap="square" />
    <polygon points="356,338 340,331 340,345" fill="#fde047" />

    <!-- Prominent Geotechnical System Labels: RMR, Q, GSI in Golden Yellow -->
    <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#fde047" letter-spacing="1.2">
      <text x="188" y="210">RMR</text>
      <text x="188" y="240">Q</text>
      <text x="188" y="270">GSI</text>
    </g>

    <!-- Trend Line / Rating Curve with Circular Data Nodes -->
    <!-- Connecting Trend Line -->
    <line x1="188" y1="316" x2="342" y2="242" stroke="#fde047" stroke-width="5" stroke-linecap="round" />

    <!-- 5 Calibration Data Nodes with Amber Ring and White Core -->
    <!-- Node 1 -->
    <circle cx="188" cy="316" r="8" fill="#fde047" stroke="#ffffff" stroke-width="2.5" />
    <!-- Node 2 -->
    <circle cx="222" cy="300" r="7.5" fill="#fde047" stroke="#ffffff" stroke-width="2.5" />
    <!-- Node 3 -->
    <circle cx="260" cy="282" r="7.5" fill="#fde047" stroke="#ffffff" stroke-width="2.5" />
    <!-- Node 4 -->
    <circle cx="298" cy="264" r="7.5" fill="#fde047" stroke="#ffffff" stroke-width="2.5" />
    <!-- Node 5 (Peak Endpoint) -->
    <circle cx="342" cy="242" r="9" fill="#fde047" stroke="#ffffff" stroke-width="3" />
  </g>
</svg>
